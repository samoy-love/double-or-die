<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Double or Die</title>
    <meta
      name="description"
      content="Роглайт, где сложность выбираешь ты сам — пари на самого себя"
    />
    <!--
      Иконка одна и векторная. Ссылка обязательна: без неё браузер сам просит
      /favicon.ico, получает 404 и пишет об этом в консоль — то есть шумит
      ровно в том канале, по которому агент читает настоящие ошибки.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <!--
      Даёт браузеру повод предложить «Установить приложение» — не замена
      Electron-доставке (TECH §8.1, веха 0.10.0), а побочный эффект уже
      существующего sw.js, полезный для плейтеста уже сейчас (TECH §8.6).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      iOS Safari манифест игнорирует целиком — своя иконка нужна отдельным
      тегом, иначе на домашнем экране iPhone окажется скриншот страницы.
    -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Цвет строки браузера на телефоне: тот же фон, что у арены. -->
    <meta name="theme-color" content="#1a1033" />
    <link rel="stylesheet" href="/packages/client/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/packages/client/src/main.ts"></script>
  </body>
</html>
