version: 2

# Обновления зависимостей раз в неделю, по понедельникам: реже — и копится
# пачка, которую разбирают залпом и потому невнимательно; чаще — и PR
# перестают читать вовсе.
#
# open-pull-requests-limit держит очередь короткой намеренно. Двадцать
# открытых PR от бота — это не двадцать обновлений, а ноль.
#
# Сообщения на русском в повелительном наклонении, как везде в этих
# репозиториях (CLAUDE.md). Префикс deps: отделяет машинные правки от
# человеческих — и он же выбрасывает их из списка изменений в релизе,
# потому что «bump actions/checkout» в чате не говорит ничего.

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  # Зависимости живут только в корневом package.json, и отдельные записи на
  # воркспейсы здесь не нужны — но не потому, что манифестов нет: у каждого
  # пакета свой (@dod/sim, @dod/shared, @dod/client, @dod/tools). Причина в
  # том, что все четыре объявлены с нулём зависимостей и такими обязаны
  # остаться: у `sim` это требование безопасности (SECURITY §7 — самая
  # критичная часть кода не имеет поверхности атаки через npm вовсе), и
  # проверяется оно гейтом границ, а не обещанием. Появится зависимость в
  # пакете — сначала это уронит check:boundaries, и только потом понадобится
  # запись здесь.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    ignore:
      # TypeScript 7 не встаёт, пока его не поддержит typescript-eslint: тот
      # объявляет peer typescript ">=4.8.4 <6.1.0", и npm ci падает на
      # разрешении зависимостей ещё до компиляции. Это очередь обновлений, а
      # не наш код — и PR с ним будет красным каждую неделю, пока очередь не
      # сдвинется.
      #
      # СНЯТЬ, как только typescript-eslint объявит поддержку 7.x — вместе с
      # обновлением самого typescript-eslint, одним PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
