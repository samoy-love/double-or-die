name: Покрытие main

# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ШАГ В ci.yml.
#
# Codecov привязывает отчёт к КОММИТУ, а бейдж и «project»-статус считает по
# ветке по умолчанию. Отчёты из ci.yml приходят на коммиты веток PR — для main
# они не приезжают никогда, потому что ci.yml намеренно ходит только по
# pull_request. Без этого файла цифра main не обновлялась бы вовсе, а бейдж
# показывал бы прогон недельной давности — то самое «украшение, которое врёт».
#
# Возвращать `push: branches: [main]` в ci.yml дороже: там ещё линтеры, сборка,
# проверки детерминизма и кроссплатформенности — всё это уже отработало на PR
# и на том же дереве. Здесь только то, что даёт цифру.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Получение зависимостей повторяется — обоснование и границы записаны в
# `ci.yml`, где живёт основной конвейер.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

# Сторонние actions — по полному SHA с тегом в комментарии, обоснование и
# порядок обновления записаны один раз в `ci.yml`. Здесь это особенно к месту:
# у шага ниже есть токен Codecov.

# Мержи иногда идут подряд; предыдущий счёт не нужен, важен последний main.
concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  coverage:
    name: Покрытие main в Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: sh scripts/retry.sh npm ci

      # Ровно та же команда, что и на PR: цифры обязаны считаться одинаково,
      # иначе сравнение «PR против main» перестаёт что-либо значить.
      - name: Test
        run: npm run test:coverage

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: unit
          # Репозиторий ЗАКРЫТЫЙ, поэтому токен обязателен: бестокенная
          # загрузка работает только у публичных, и без секрета шаг упадёт.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Здесь строго: молча не отправленный отчёт означает застывший бейдж,
          # а это ровно та поломка, ради которой файл и заведён.
          fail_ci_if_error: true
