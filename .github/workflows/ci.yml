name: CI

on:
  # Только pull_request: гейт — мерж, а мерж идёт через PR. Проверять нужно
  # результат слияния с main, а не голую ветку, и делать это один раз, а не
  # дважды на тот же коммит.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Получение зависимостей повторяется, всё остальное — нет.
#
# Чужие серверы отвечают 403, 502 и обрывом соединения независимо от нашего
# кода: так уже падал `playwright install-deps`, когда зеркало Microsoft
# отдало 403 на `apt-get update`. Красный прогон на этом месте ничего не
# сообщает о PR, но стоит ручного перезапуска, а CI, который врёт через раз,
# перестают читать — и он пропускает настоящую поломку.
#
# Два уровня, потому что ломается на двух уровнях. Переменные ниже — про
# ОТДЕЛЬНЫЙ запрос: npm сам переспросит подвисший тарбол, не переустанавливая
# всё дерево. `scripts/retry.sh` — про команду целиком: она падает и после
# внутренних повторов, а у apt и playwright своих повторов нет вовсе.
#
# Повторять тесты, линтеры и проверки детерминизма запрещено: там повтор
# превращает плавающий баг — самый дорогой класс в этом проекте — в зелёную
# галочку.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

# Только pull_request (см. блок on:), поэтому на main это не бежит никогда —
# отменять свежим прогоном старый безопасно всегда, без условия по ветке
# (как в snakes и tr0llex).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Сторонние actions запиннены по полному коммит-SHA, тег — комментарием рядом
# (SECURITY §7).
#
# Причина не в аккуратности, а в модели угроз: `@v7` — это подвижная ссылка в
# ЧУЖОМ репозитории, и владелец (или тот, кто увёл его учётку) переставляет её
# на любой коммит в любую секунду. Наши workflow работают с секретами деплоя и
# подписи, поэтому подменённый `checkout` — это не сломанная сборка, а тихая
# утечка ключей: прогон остаётся зелёным, а логи выглядят как обычно. SHA
# неподвижен, и подменить его нельзя, не подменив содержимое коммита.
#
# КАК ОБНОВЛЯТЬ: не руками. Dependabot настроен на экосистему github-actions
# (`.github/dependabot.yml`) и умеет обновлять именно эту форму — он двигает
# SHA и переписывает тег в комментарии рядом, потому что читает его как
# версию. То есть пиннинг не замораживает обновления, а лишь переводит их из
# «молча в любой момент» в «отдельным PR с ревью», как того и требует
# SECURITY §7 про обновления зависимостей.
#
# Тег в комментарии обязателен: без него ни человек, ни бот не знают, какая
# это версия, и строка превращается в неопознанные сорок символов.
jobs:
  # Слиты в одну задачу: commits, secrets, workflows(quality-часть), build не
  # трогавшие сеть сверх обычного `npm ci` и линт/тайп-чек/сборка — каждая по
  # отдельности занимала ~1с полезной работы, а GitHub тарифицирует задачу
  # целиком, округляя вверх до минуты (owner approved). Слиты только те, чьи
  # авторские комментарии объясняли, ЧТО проверяется, а не то, что проверку
  # нельзя пускать в общем логе — эту причину смотри в комментарии ниже про
  # то, что НЕ слито (`hooks`, `workflows`, `supply-chain`).
  #
  # `commits` и `secrets` читают диапазон `origin/${{ base_ref }}..HEAD`,
  # которого нет у ручного запуска (`workflow_dispatch`) — раньше это решалось
  # условием на весь job, теперь тем же условием на каждый из двух шагов:
  # остальные шаги (лint, типы, сборка) обязаны идти и при ручном запуске.
  quality:
    name: Линт, типы, коммиты, секреты, сборка
    runs-on: [self-hosted, home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна только `commits`/`secrets` (диапазон от точки
          # ветвления), но лишней ей не станет ни один из остальных шагов.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Линтеры идут до сборки: падают за секунды, сборка дольше.
      #
      # Линт стоит первым шагом конвейера по TECH §13 и до сих пор в CI не
      # запускался вовсе: правило было записано, машиной не проверялось, и
      # ошибка доезжала до ревью. Шаги перечислены поимённо, а не свёрнуты в
      # `npm run check`, намеренно: в логе видно, ЧТО именно упало, без чтения
      # вывода, а зелёные шаги остаются зелёными по отдельности.
      - name: Линт
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      # Ядро симуляции обязано оставаться чистым. Пропущенный Math.random
      # внутрь ломает реплеи, дейли, античит и онлайн разом, причём молча.
      # Здесь же — направления между пакетами: `sim` не знает о клиенте.
      - name: Границы модулей
        run: npm run check:boundaries

      # Цвет мимо палитры ломает перекраску под дальтонизм и замер контраста,
      # а замечается только глазами и только на том мониторе, где смотрели.
      - name: Цвета только в палитре
        run: npm run check:palette

      # Записанное в палитре «ΔE 20» само по себе не проверяет ничего: правка
      # оттенка «чтобы покрасивее» сближает пару незаметно и накопительно, а
      # расплата конкретная — игрок читается как враг, карта как фишка.
      - name: Различимость цветов по ΔE
        run: npm run check:contrast

      # Каталог пари собирается в модуль ядра из JSON. Правка данных без
      # пересборки даёт молчаливое расхождение: тесты гоняют старые числа,
      # игра — старые числа, а в репозитории лежат новые, и заметить это
      # некому. `--check` пересобирает в память и сверяет с закоммиченным.
      - name: Каталог пари пересобран
        run: npm run check:content

      # `check:i18n` входит в локальный `npm run check` (package.json), но не
      # был перечислен здесь поимённо — локальный гейт был шире CI: строка,
      # вписанная мимо словаря, или ключ без перевода проезжали в PR молча.
      - name: Видимые строки — только через словарь
        run: npm run check:i18n

      # Соглашение из CLAUDE.md, проверяемое машиной.
      #
      # Только на PR: у ручного запуска нет базовой ветки, и диапазон
      # `origin/..HEAD` уронил бы шаг на пустом месте.
      - name: Коммиты без упоминаний ИИ
        if: github.event_name == 'pull_request'
        run: |
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

      # Сканер секретов на стороне, которую нельзя обойти.
      #
      # До сих пор он жил только в `.githooks/pre-commit`, а этого недостаточно
      # по двум причинам сразу: хук обходится флагом `--no-verify` и не
      # действует на чужих машинах — клоном хуки не переносятся вовсе
      # (TECH §12А). То есть единственная преграда перед утечкой ключа
      # держалась на том, что все всегда выполнили `git config
      # core.hooksPath` и никто не торопился. Между тем утёкший ключ чистится
      # переписыванием опубликованной истории и отзывом самого ключа, а
      # замечает утечку обычно никто: коммит обычный, CI зелёный.
      #
      # Правила — те же самые, физически те же: `scripts/check-secrets.sh`
      # зовут и хук, и этот шаг. Два списка шаблонов, живущих порознь,
      # расходятся, и разошедшийся список хуже отсутствующего — он выглядит
      # работающим.
      #
      # Проверяются только ДОБАВЛЯЕМЫЕ строки диффа PR (ROADMAP 0.1.0):
      # сканер, ругающийся на давно лежащий в репозитории текст, отключают
      # через неделю. Только на PR по той же причине, что и коммиты выше: у
      # ручного запуска нет базовой ветки, и сравнивать не с чем.
      - name: Секреты не уезжают в историю
        if: github.event_name == 'pull_request'
        run: |
          # Три точки, а не две: сравнивать надо с точкой ветвления, иначе в
          # «добавленные» попадёт всё, что за это время приехало в main, и
          # проверка начнёт ругаться на чужие строки.
          sh scripts/check-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"

      - name: Сборка
        run: npm run build

      # Отладочный интерфейс даёт полный контроль над симуляцией — в релизе
      # это чит, а не удобство. Проверка функциональная, а не поиск строки.
      - name: В релизе нет отладочного интерфейса
        run: npm run check:no-debug-api

      # Бенч ловит обвал на порядок — аллокацию в горячем пути или случайно
      # квадратичный проход. Порог мягкий намеренно: на общем раннере разброс
      # и так десятки процентов, а тест, который краснеет сам по себе,
      # перестают читать.
      - name: Бенч ядра в бюджете кадра
        run: npm run bench

      # Файл на месте, лицензия указана, ссылка из кода жива. Пропавший ассет
      # иначе всплывает уже на проде, а неуказанная лицензия — при релизе.
      - name: Ассеты на месте и с лицензиями
        run: npm run assets

      # Калибровочный гейт (SIMULATION §2) — тем же объёмом, что и раньше
      # (200 забегов на профиль, `tests/helpers/calibration-gate.ts`), но
      # своим шагом и своим конфигом (`vitest.calibration.config.ts`), а не
      # частью `npm test`: раньше эти 107 из 113с полного прогона платились
      # трижды — по разу на каждую ОС матрицы `determinism` — хотя платформа
      # тут ни при чём, гейт про экономику, а не про недетерминизм. Один раз
      # на ubuntu — тот же охват, без утроения.
      #
      # Полный ночной объём (все 16 профилей, ~50 000 забегов, SIMULATION §2)
      # не здесь: `CALIBRATION_RUNS`/`CALIBRATION_TICKS`/`CALIBRATION_TIMEOUT_MS`
      # поднимают объём тому же `npm run test:calibration` по расписанию или
      # вручную (calibration-gate.ts) — на каждый PR идёт быстрый вариант,
      # урезанный не по объёму, а по частоте.
      - name: Калибровка абстрактной модели (SIMULATION §2)
        run: npm run test:calibration

  # Цепочка поставок: уязвимости и лицензии зависимостей (SECURITY §7).
  #
  # Отдельная задача, а не шаг в `quality`: она единственная ходит в сеть, и
  # падение реестра не должно выглядеть как сломанный линт.
  supply-chain:
    name: 'Зависимости: аудит и лицензии'
    runs-on: [self-hosted, home]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Порог строгости выбран в самом скрипте и объяснён там же: high и
      # critical валят, moderate и low печатаются. Коротко — всё, что стоит в
      # проекте, это devDependencies (сборщик, раннер, линтер), до игрока они
      # не доезжают, а красная сборка на low-находке в чужой транзитивной
      # зависимости учит не читать этот шаг. После чего он не поймает и
      # critical.
      #
      # Лицензии читаются из lockfile, а не из node_modules: часть пакетов
      # ставится только под свою платформу, и проверка по диску врала бы
      # по-разному на разных ОС.
      #
      # Повтор здесь по той же причине, что и у установки: `npm audit` — это
      # запрос к реестру, и его пятисотка означает недоступный реестр, а не
      # найденную уязвимость.
      - name: Аудит и лицензии
        run: sh scripts/retry.sh npm run check:deps

  # Детерминизм на трёх ОС — главный гейт этого проекта.
  #
  # Расхождение хешей между Windows, macOS и Linux означает, что игроки на
  # разных платформах увидят разные миры, а golden-реплеи перестанут сходиться.
  # Поймать это иначе невозможно: на одной машине всё работает всегда.
  determinism:
    name: Детерминизм (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows заметно медленнее (~1 мин) mac/ubuntu (~37-38с) на одном и том же
    # наборе шагов; запас общий для всей матрицы, а не подобран по ОС.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # `shell: bash` обязателен: на windows-latest шаги идут в PowerShell, где
      # `sh` не команда, а неизвестное имя.
      - name: Зависимости
        shell: bash
        run: sh scripts/retry.sh npm ci

      # Golden-реплеи и сценарии идут внутри `npm test`, а значит — на всех
      # трёх ОС. Отдельная задача им не нужна: они проверяют ядро, а ядро
      # здесь и так собирается на каждой платформе.
      - name: Тесты
        run: npm test

      # `--setup tests/ci-setup/room5.json` — тот же приём, что вылечил
      # слепоту golden-корпуса в ре-бейзлайне 0.3.11 (golden.ts): один игрок
      # ботом `random` за 1800 тиков со старта комнаты 1 гибнет ещё ДО этого
      # окна (замерено: смерть на тиках 692–1484 во всех 100 сидах), и
      # оставшиеся тики — снимок замороженного мира после экрана итогов
      # (`RunPhase.Summary`), а не проверка чего-либо. `{ room: 5 }` —
      # `startRoom` в ту же точку, что уже использует golden-эталон
      # `scenario-enemies-p1` — стартует сразу с комнаты, где расписание
      # (DIFFICULTY §7) открыло все три типа врага, и хеш с безопасной
      # точкой проверяют реальный бой, а не пустую комнату 1.
      - name: Один сид — один хеш
        run: npm run sim -- --determinism-check --seeds 100 --ticks 1800 --bot random --setup tests/ci-setup/room5.json

      # Достижимость безопасной точки — ограничитель D4. Проверяется на каждом
      # тике: непроходимой комбинация бывает ровно один кадр, и именно в этот
      # кадр игрок теряет сердце. Гоняется на всех трёх ОС заодно с остальным
      # ядром — расхождение платформ здесь так же смертельно, как в хешах.
      - name: Безопасная точка достижима всегда
        run: npm run safety

      # Хеши уезжают артефактом: если платформы разойдутся, сравнивать нужно
      # конкретные числа, а не пересказ. Тот же старт с комнаты 5, что и выше
      # — иначе сверка платформ сравнивала бы двадцать одинаковых снимков
      # замороженной комнаты 1.
      # Раннер пишет файл сам: перенаправление `> файл` захватило бы ещё и
      # баннер npm, и на выходе получился бы не JSON.
      - name: Снять эталонные хеши
        run: npm run sim -- --runs 20 --bot random --ticks 1800 --setup tests/ci-setup/room5.json --out hashes-${{ matrix.os }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.json
          retention-days: 7

  # Сверка хешей между платформами. Тесты выше проверяют, что машина
  # воспроизводит саму себя; здесь — что все три согласны друг с другом.
  #
  # Не кандидат на слияние с односекундными задачами (задача про них — ниже):
  # `needs: determinism` и `download-artifact` требуют отдельного job'а
  # физически — тремя артефактами матрицы `determinism` шаг внутри чужой
  # задачи не воспользуется.
  cross-platform:
    name: Платформы согласны
    needs: determinism
    runs-on: [self-hosted, home]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hashes-*
          merge-multiple: false

      - name: Сравнить
        run: |
          node -e "
          const fs = require('fs');
          const dirs = fs.readdirSync('.').filter(d => d.startsWith('hashes-'));
          const runs = dirs.map(d => {
            const f = fs.readdirSync(d)[0];
            return { os: d, data: JSON.parse(fs.readFileSync(d + '/' + f, 'utf8')) };
          });
          // Гейт обязан объяснять, чем недоволен. Раньше он падал за две
          // секунды на разыменовании undefined — «сравнение не состоялось» и
          // «хеши разошлись» выглядели одинаково, а это разные события: первое
          // означает сломанную оснастку, второе — сломанный детерминизм.
          console.log('скачано наборов: ' + runs.length + ' (' + dirs.join(', ') + ')');
          if (runs.length < 2) {
            console.error('::error::сравнивать нечего: наборов хешей ' + runs.length + ', нужно минимум два');
            process.exit(1);
          }
          const base = runs[0];
          const sizes = runs.map(r => r.os + '=' + (r.data.results ? r.data.results.length : 'нет results'));
          if (runs.some(r => !Array.isArray(r.data.results))) {
            console.error('::error::в наборе нет списка результатов: ' + sizes.join(' '));
            process.exit(1);
          }
          if (new Set(runs.map(r => r.data.results.length)).size !== 1) {
            // Разное число забегов означает, что на какой-то платформе прогон
            // оборвался. Сравнивать поэлементно тут нельзя: вторая половина
            // сравнений уйдёт в undefined и соврёт про детерминизм.
            console.error('::error::платформы прогнали разное число забегов: ' + sizes.join(' '));
            process.exit(1);
          }
          let bad = 0;
          for (const r of runs.slice(1)) {
            for (let i = 0; i < base.data.results.length; i++) {
              const a = base.data.results[i], b = r.data.results[i];
              if (a.hash !== b.hash) {
                console.error('расхождение сид ' + a.seed + ': ' + base.os + '=' + a.hash + ' ' + r.os + '=' + b.hash);
                bad++;
              }
            }
          }
          if (bad) { console.error('::error::детерминизм сломан между платформами'); process.exit(1); }
          console.log('все платформы согласны: ' + base.data.results.length + ' сидов');
          "

  # Хуки — единственная преграда перед прямым пушем в main: защита ветки и
  # rulesets для приватного репозитория требуют GitHub Pro, а видимость менять
  # нельзя (TECH §12А). Сломанный хук молчит ровно так же, как отсутствующий,
  # поэтому его разбор и статический анализ — часть гейта.
  #
  # Не слита с `quality` при слиянии односекундных задач: шаг `apt-get install
  # shellcheck` ниже ходит в сеть за пакетом (`retry.sh` не совпадение — то же
  # зеркало уже роняло `apt-get update` в `e2e`), и по той же причине, что
  # `supply-chain` не шаг в `quality` — недоступный apt-репозиторий не должен
  # выглядеть как сломанный линт.
  hooks:
    name: Хуки разбираются
    runs-on: [self-hosted, home]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Сюда же попали shell-скрипты из scripts/: сканер секретов вынесен из
      # хука туда, и сломанный он молчит ровно так же, как сломанный хук.
      - name: Синтаксис
        run: |
          fail=0
          for f in .githooks/* scripts/*.sh; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::скрипт не разбирается"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sh scripts/retry.sh sudo apt-get update -qq
          sh scripts/retry.sh sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .githooks/* scripts/*.sh

  # Workflow — тоже код, и ломается он ровно так же: опечатка в имени поля,
  # несуществующий вход у переиспользуемого workflow, устаревшая версия
  # runner. Разница в том, что ошибка видна только в момент запуска, а
  # запускается это на мерже в main — то есть уже на проде.
  #
  # Не слита с `quality`: шаг ниже качает `actionlint` с
  # raw.githubusercontent.com, а недоступность GitHub-зеркала (см. `e2e` и
  # `hooks` выше) не должна читаться как «workflow разбирается неверно».
  workflows:
    name: Сами workflow разбираются
    runs-on: [self-hosted, home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          # Скачивание отделено от запуска: повторять надо поход в сеть, а не
          # разбор workflow — иначе настоящая ошибка в yml повторится трижды и
          # утонет в собственном выводе.
          sh scripts/retry.sh sh -c 'curl -sSfo download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash && bash download-actionlint.bash'
          ./actionlint -color

  # Сквозные тесты: единственная проверка, которая видит РЕНДЕР.
  #
  # Ядро проверяется без графики и проверяется хорошо, но между «симуляция
  # считает верно» и «игра работает» лежит весь WebGL: не собрался шейдер, не
  # инициализировался контекст, встал цикл — юниты остаются зелёными, а на
  # экране пусто. Здесь же живёт нагрузочный бенч рендера из плана версии:
  # 2000 частиц и 200 болванок в бюджете кадра.
  e2e:
    name: Сквозные тесты и бенч рендера
    runs-on: [self-hosted, home]
    # Реально ~1m21s, запас на холодный кэш Playwright и общую загрузку раннера.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Только Chromium: прогон идёт в нём одном, остальные браузеры — лишние
      # сотни мегабайт на каждый PR.
      # Оба шага ниже тянут пакеты apt и бинарник браузера, и оба уже падали
      # так: зеркало `packages.microsoft.com` ответило 403 на `apt-get update`,
      # playwright вышел с кодом 100, PR остался красным ни за что. Попыток
      # пять, а не три: недоступность зеркала измеряется минутами.
      - name: Поставить Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: sh scripts/retry.sh --attempts 5 npx playwright install --with-deps chromium

      - name: Системные зависимости Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: sh scripts/retry.sh --attempts 5 npx playwright install-deps chromium

      - name: Прогон
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # `build` слит в задачу `quality` выше: у него не было ни отдельного
  # сетевого шага, ни явной причины стоять изолированно от линта — только
  # соседние по смыслу шаги (сборка, отладочный API, бенч, ассеты).

  # Переименование или слияние задач CI не красит прогон в красный — красной
  # становится защита ветки, и только через день, на СЛЕДУЮЩЕМ PR: main ждёт
  # проверку по старому имени вечно, а "Merge" молчит о причине. Руками это
  # правится в Settings → Branches, но руками же и забывается.
  #
  # GITHUB_TOKEN сюда не годится: у него в принципе нет permission scope для
  # чтения защиты ветки (полный список — actions, artifact-metadata,
  # attestations, checks, contents, deployments, discussions, id-token,
  # issues, models, packages, pages, pull-requests, repository-projects,
  # security-events, statuses; administration среди них нет, хотя REST API и
  # называет его так). Отсюда PROTECTION_READ_TOKEN — fine-grained PAT с
  # двумя правами: Administration: Read-only (список обязательных проверок) и
  # Actions: Read-only (список задач текущего прогона — тем же токеном
  # читаются обе стороны сравнения). Лежит в secrets репозитория и
  # передаётся только этому шагу, а не всей задаче.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: [self-hosted, home]
    timeout-minutes: 5
    # needs — не про очерёдность результата, а про то, что видит Jobs API.
    # GitHub регистрирует задачу с зависимостями в API прогона только когда
    # её needs выполнены и она реально стартовала — без needs эта задача
    # финиширует за секунды и застаёт API в момент, когда половина остальных
    # задач ещё не создана, а не пропущена. Итог — те же ложные "пропала
    # проверка", от которых задача должна защищать.
    needs:
      - quality
      - supply-chain
      - determinism
      - cross-platform
      - hooks
      - workflows
      - e2e
    if: always()
    env:
      GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
    steps:
      # Секреты репозитория не отдаются прогонам dependabot и форков — там
      # PAT приходит пустым. Сверять нечего: задача проверяет настройку
      # репозитория, а не содержимое PR, и на своих ветках отработает та же
      # проверка. Падать здесь — значит красить чужие PR за то, чего они не
      # ломали, поэтому пропускаем явно и вслух.
      - name: Пропустить сверку без доступа к защите ветки
        if: env.GH_TOKEN == ''
        run: |
          echo "::notice::PAT недоступен (dependabot или форк) — сверка защиты ветки пропущена"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GH_TOKEN != ''

      - name: Сверить задачи с обязательными проверками main
        if: env.GH_TOKEN != ''
        env:
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh
