name: CI

on:
  # Только pull_request: гейт — мерж, а мерж идёт через PR. Проверять нужно
  # результат слияния с main, а не голую ветку, и делать это один раз, а не
  # дважды на тот же коммит.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Получение зависимостей повторяется, всё остальное — нет.
#
# Чужие серверы отвечают 403, 502 и обрывом соединения независимо от нашего
# кода: так уже падал `playwright install-deps`, когда зеркало Microsoft
# отдало 403 на `apt-get update`. Красный прогон на этом месте ничего не
# сообщает о PR, но стоит ручного перезапуска, а CI, который врёт через раз,
# перестают читать — и он пропускает настоящую поломку.
#
# Два уровня, потому что ломается на двух уровнях. Переменные ниже — про
# ОТДЕЛЬНЫЙ запрос: npm сам переспросит подвисший тарбол, не переустанавливая
# всё дерево. `scripts/retry.sh` — про команду целиком: она падает и после
# внутренних повторов, а у apt и playwright своих повторов нет вовсе.
#
# Повторять тесты, линтеры и проверки детерминизма запрещено: там повтор
# превращает плавающий баг — самый дорогой класс в этом проекте — в зелёную
# галочку.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '10000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '60000'

# Сторонние actions запиннены по полному коммит-SHA, тег — комментарием рядом
# (SECURITY §7).
#
# Причина не в аккуратности, а в модели угроз: `@v7` — это подвижная ссылка в
# ЧУЖОМ репозитории, и владелец (или тот, кто увёл его учётку) переставляет её
# на любой коммит в любую секунду. Наши workflow работают с секретами деплоя и
# подписи, поэтому подменённый `checkout` — это не сломанная сборка, а тихая
# утечка ключей: прогон остаётся зелёным, а логи выглядят как обычно. SHA
# неподвижен, и подменить его нельзя, не подменив содержимое коммита.
#
# КАК ОБНОВЛЯТЬ: не руками. Dependabot настроен на экосистему github-actions
# (`.github/dependabot.yml`) и умеет обновлять именно эту форму — он двигает
# SHA и переписывает тег в комментарии рядом, потому что читает его как
# версию. То есть пиннинг не замораживает обновления, а лишь переводит их из
# «молча в любой момент» в «отдельным PR с ревью», как того и требует
# SECURITY §7 про обновления зависимостей.
#
# Тег в комментарии обязателен: без него ни человек, ни бот не знают, какая
# это версия, и строка превращается в неопознанные сорок символов.
jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  commits:
    name: Коммиты без упоминаний ИИ
    # Только на PR: у ручного запуска нет базовой ветки, и диапазон
    # `origin/..HEAD` уронил бы работу на пустом месте.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  quality:
    name: Линт, типы, границы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Линтеры идут до сборки: падают за секунды, сборка дольше.
      #
      # Линт стоит первым шагом конвейера по TECH §13 и до сих пор в CI не
      # запускался вовсе: правило было записано, машиной не проверялось, и
      # ошибка доезжала до ревью. Шаги перечислены поимённо, а не свёрнуты в
      # `npm run check`, намеренно: в логе видно, ЧТО именно упало, без чтения
      # вывода, а зелёные шаги остаются зелёными по отдельности.
      - name: Линт
        run: npm run lint

      - name: Формат
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      # Ядро симуляции обязано оставаться чистым. Пропущенный Math.random
      # внутрь ломает реплеи, дейли, античит и онлайн разом, причём молча.
      # Здесь же — направления между пакетами: `sim` не знает о клиенте.
      - name: Границы модулей
        run: npm run check:boundaries

      # Цвет мимо палитры ломает перекраску под дальтонизм и замер контраста,
      # а замечается только глазами и только на том мониторе, где смотрели.
      - name: Цвета только в палитре
        run: npm run check:palette

      # Записанное в палитре «ΔE 20» само по себе не проверяет ничего: правка
      # оттенка «чтобы покрасивее» сближает пару незаметно и накопительно, а
      # расплата конкретная — игрок читается как враг, карта как фишка.
      - name: Различимость цветов по ΔE
        run: npm run check:contrast

      # Каталог пари собирается в модуль ядра из JSON. Правка данных без
      # пересборки даёт молчаливое расхождение: тесты гоняют старые числа,
      # игра — старые числа, а в репозитории лежат новые, и заметить это
      # некому. `--check` пересобирает в память и сверяет с закоммиченным.
      - name: Каталог пари пересобран
        run: npm run check:content

  # Сканер секретов на стороне, которую нельзя обойти.
  #
  # До сих пор он жил только в `.githooks/pre-commit`, а этого недостаточно по
  # двум причинам сразу: хук обходится флагом `--no-verify` и не действует на
  # чужих машинах — клоном хуки не переносятся вовсе (TECH §12А). То есть
  # единственная преграда перед утечкой ключа держалась на том, что все всегда
  # выполнили `git config core.hooksPath` и никто не торопился. Между тем
  # утёкший ключ чистится переписыванием опубликованной истории и отзывом
  # самого ключа, а замечает утечку обычно никто: коммит обычный, CI зелёный.
  #
  # Правила — те же самые, физически те же: `scripts/check-secrets.sh` зовут и
  # хук, и этот шаг. Два списка шаблонов, живущих порознь, расходятся, и
  # разошедшийся список хуже отсутствующего — он выглядит работающим.
  #
  # Проверяются только ДОБАВЛЯЕМЫЕ строки диффа PR (ROADMAP 0.1.0): сканер,
  # ругающийся на давно лежащий в репозитории текст, отключают через неделю.
  secrets:
    name: Секреты не уезжают в историю
    # Только на PR: у ручного запуска нет базовой ветки, и сравнивать не с чем.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история: без неё нет ни базовой ветки, ни точки ветвления.
          fetch-depth: 0

      - name: Сканер по диффу PR
        run: |
          # Три точки, а не две: сравнивать надо с точкой ветвления, иначе в
          # «добавленные» попадёт всё, что за это время приехало в main, и
          # проверка начнёт ругаться на чужие строки.
          sh scripts/check-secrets.sh --range "origin/${{ github.base_ref }}...HEAD"

  # Цепочка поставок: уязвимости и лицензии зависимостей (SECURITY §7).
  #
  # Отдельная задача, а не шаг в `quality`: она единственная ходит в сеть, и
  # падение реестра не должно выглядеть как сломанный линт.
  supply-chain:
    name: 'Зависимости: аудит и лицензии'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Порог строгости выбран в самом скрипте и объяснён там же: high и
      # critical валят, moderate и low печатаются. Коротко — всё, что стоит в
      # проекте, это devDependencies (сборщик, раннер, линтер), до игрока они
      # не доезжают, а красная сборка на low-находке в чужой транзитивной
      # зависимости учит не читать этот шаг. После чего он не поймает и
      # critical.
      #
      # Лицензии читаются из lockfile, а не из node_modules: часть пакетов
      # ставится только под свою платформу, и проверка по диску врала бы
      # по-разному на разных ОС.
      #
      # Повтор здесь по той же причине, что и у установки: `npm audit` — это
      # запрос к реестру, и его пятисотка означает недоступный реестр, а не
      # найденную уязвимость.
      - name: Аудит и лицензии
        run: sh scripts/retry.sh npm run check:deps

  # Детерминизм на трёх ОС — главный гейт этого проекта.
  #
  # Расхождение хешей между Windows, macOS и Linux означает, что игроки на
  # разных платформах увидят разные миры, а golden-реплеи перестанут сходиться.
  # Поймать это иначе невозможно: на одной машине всё работает всегда.
  determinism:
    name: Детерминизм (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # `shell: bash` обязателен: на windows-latest шаги идут в PowerShell, где
      # `sh` не команда, а неизвестное имя.
      - name: Зависимости
        shell: bash
        run: sh scripts/retry.sh npm ci

      # Golden-реплеи и сценарии идут внутри `npm test`, а значит — на всех
      # трёх ОС. Отдельная задача им не нужна: они проверяют ядро, а ядро
      # здесь и так собирается на каждой платформе.
      - name: Тесты
        run: npm test

      - name: Один сид — один хеш
        run: npm run sim -- --determinism-check --seeds 100 --ticks 1800 --bot random

      # Достижимость безопасной точки — ограничитель D4. Проверяется на каждом
      # тике: непроходимой комбинация бывает ровно один кадр, и именно в этот
      # кадр игрок теряет сердце. Гоняется на всех трёх ОС заодно с остальным
      # ядром — расхождение платформ здесь так же смертельно, как в хешах.
      - name: Безопасная точка достижима всегда
        run: npm run safety

      # Хеши уезжают артефактом: если платформы разойдутся, сравнивать нужно
      # конкретные числа, а не пересказ.
      # Раннер пишет файл сам: перенаправление `> файл` захватило бы ещё и
      # баннер npm, и на выходе получился бы не JSON.
      - name: Снять эталонные хеши
        run: npm run sim -- --runs 20 --bot random --ticks 1800 --out hashes-${{ matrix.os }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.json
          retention-days: 7

  # Сверка хешей между платформами. Тесты выше проверяют, что машина
  # воспроизводит саму себя; здесь — что все три согласны друг с другом.
  cross-platform:
    name: Платформы согласны
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hashes-*
          merge-multiple: false

      - name: Сравнить
        run: |
          node -e "
          const fs = require('fs');
          const dirs = fs.readdirSync('.').filter(d => d.startsWith('hashes-'));
          const runs = dirs.map(d => {
            const f = fs.readdirSync(d)[0];
            return { os: d, data: JSON.parse(fs.readFileSync(d + '/' + f, 'utf8')) };
          });
          const base = runs[0];
          let bad = 0;
          for (const r of runs.slice(1)) {
            for (let i = 0; i < base.data.results.length; i++) {
              const a = base.data.results[i], b = r.data.results[i];
              if (a.hash !== b.hash) {
                console.error('расхождение сид ' + a.seed + ': ' + base.os + '=' + a.hash + ' ' + r.os + '=' + b.hash);
                bad++;
              }
            }
          }
          if (bad) { console.error('::error::детерминизм сломан между платформами'); process.exit(1); }
          console.log('все платформы согласны: ' + base.data.results.length + ' сидов');
          "

  # Хуки — единственная преграда перед прямым пушем в main: защита ветки и
  # rulesets для приватного репозитория требуют GitHub Pro, а видимость менять
  # нельзя (TECH §12А). Сломанный хук молчит ровно так же, как отсутствующий,
  # поэтому его разбор и статический анализ — часть гейта.
  hooks:
    name: Хуки разбираются
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Сюда же попали shell-скрипты из scripts/: сканер секретов вынесен из
      # хука туда, и сломанный он молчит ровно так же, как сломанный хук.
      - name: Синтаксис
        run: |
          fail=0
          for f in .githooks/* scripts/*.sh; do
            [ -f "$f" ] || continue
            if sh -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::скрипт не разбирается"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sh scripts/retry.sh sudo apt-get update -qq
          sh scripts/retry.sh sudo apt-get install -y -qq shellcheck
          shellcheck -S warning .githooks/* scripts/*.sh

  # Workflow — тоже код, и ломается он ровно так же: опечатка в имени поля,
  # несуществующий вход у переиспользуемого workflow, устаревшая версия
  # runner. Разница в том, что ошибка видна только в момент запуска, а
  # запускается это на мерже в main — то есть уже на проде.
  workflows:
    name: Сами workflow разбираются
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          # Скачивание отделено от запуска: повторять надо поход в сеть, а не
          # разбор workflow — иначе настоящая ошибка в yml повторится трижды и
          # утонет в собственном выводе.
          sh scripts/retry.sh sh -c 'curl -sSfo download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash && bash download-actionlint.bash'
          ./actionlint -color

  # Сквозные тесты: единственная проверка, которая видит РЕНДЕР.
  #
  # Ядро проверяется без графики и проверяется хорошо, но между «симуляция
  # считает верно» и «игра работает» лежит весь WebGL: не собрался шейдер, не
  # инициализировался контекст, встал цикл — юниты остаются зелёными, а на
  # экране пусто. Здесь же живёт нагрузочный бенч рендера из плана версии:
  # 2000 частиц и 200 болванок в бюджете кадра.
  e2e:
    name: Сквозные тесты и бенч рендера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Только Chromium: прогон идёт в нём одном, остальные браузеры — лишние
      # сотни мегабайт на каждый PR.
      # Оба шага ниже тянут пакеты apt и бинарник браузера, и оба уже падали
      # так: зеркало `packages.microsoft.com` ответило 403 на `apt-get update`,
      # playwright вышел с кодом 100, PR остался красным ни за что. Попыток
      # пять, а не три: недоступность зеркала измеряется минутами.
      - name: Поставить Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: sh scripts/retry.sh --attempts 5 npx playwright install --with-deps chromium

      - name: Системные зависимости Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: sh scripts/retry.sh --attempts 5 npx playwright install-deps chromium

      - name: Прогон
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Зависимости
        run: sh scripts/retry.sh npm ci
      - run: npm run build

      # Отладочный интерфейс даёт полный контроль над симуляцией — в релизе
      # это чит, а не удобство. Проверка функциональная, а не поиск строки.
      - name: В релизе нет отладочного интерфейса
        run: npm run check:no-debug-api

      # Бенч ловит обвал на порядок — аллокацию в горячем пути или случайно
      # квадратичный проход. Порог мягкий намеренно: на общем раннере разброс
      # и так десятки процентов, а тест, который краснеет сам по себе,
      # перестают читать.
      - name: Бенч ядра в бюджете кадра
        run: npm run bench

      # Файл на месте, лицензия указана, ссылка из кода жива. Пропавший ассет
      # иначе всплывает уже на проде, а неуказанная лицензия — при релизе.
      - name: Ассеты на месте и с лицензиями
        run: npm run assets
