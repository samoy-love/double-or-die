<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Double or Die">
  <!--
    Кость с двойкой: название игры одним знаком.

    Вектор, а не растр, по той же причине, что и всё остальное в игре, —
    рисуется кодом и масштабируется без набора размеров. На 16 пикселях
    читается только крупное, поэтому здесь ровно две точки: шесть граней в
    этот размер не влезают и превращаются в кашу.

    Цвета повторяют palette.ts (background, chip, aceShadow). Линтер палитры
    сюда не смотрит — это ассет, а не код отрисовки, — так что при перекраске
    игры файл правится руками.
  -->
  <rect width="32" height="32" rx="7" fill="#1a1033" />
  <rect x="4.5" y="4.5" width="23" height="23" rx="5" fill="#ffc531" />
  <circle cx="11.5" cy="11.5" r="3.1" fill="#2a2438" />
  <circle cx="20.5" cy="20.5" r="3.1" fill="#2a2438" />
</svg>
