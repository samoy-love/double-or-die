# Что именно считается покрытием — и почему это стоит записать.
#
# Без этого файла Codecov берёт всё, что приехало в отчёте, и считает процент
# по нему: генерируемые файлы, конфиги и сборочные артефакты тянут цифру в
# любую сторону, ничего не говоря о качестве тестов. Пороги ниже — тоже
# решение: статус, падающий от шума в десятые доли, через неделю начинают
# игнорировать.

coverage:
  status:
    project:
      default:
        threshold: 1%
    patch:
      default:
        # С новым кодом строже, чем со старым: догонять покрытие задним числом
        # никто не станет, а не дать ему просесть — дёшево.
        target: 70%
        threshold: 5%

flags:
  unit:
    paths:
      - packages/
    carryforward: true

# Считаем то, что определяет поведение игры. Рендер (packages/client/src/gl)
# из отчёта НЕ исключён намеренно, хотя покрыт нулём: спрятать его значило бы
# поднять общую цифру, ничего не изменив в тестах. Пусть ноль будет виден.
ignore:
  - "tests/**"
  - "scripts/**"
  - "packages/tools/**"
  - "docs/**"
  - "dist/**"
  - "**/*.config.ts"
  - "**/*.d.ts"

comment:
  layout: "reach, diff, flags"
  require_changes: true
